name: bladna
description: "BLADNA — a map-first geospatial environmental game set in Greater Tunis (GREEN HACKATHON 2026)."
publish_to: 'none'
version: 0.3.0+3

environment:
  # Dart 3.6 ships with Flutter 3.27, the first release with Color.withValues().
  sdk: '>=3.6.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.2
  shared_preferences: ^2.3.2
  # The map is the game world. Imagery tiles need internet; gameplay state is local.
  flutter_map: ^8.2.0
  latlong2: ^0.10.1
  # Field Evidence: photos for the future waste-recognition dataset.
  image_picker: ^1.1.2
  path_provider: ^2.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  # Brand assets (logo files for docs and the README; the app draws the
  # logo in code, see lib/shared/widgets/brand.dart).
  assets:
    - assets/brand/

  # Fonts are bundled locally (SIL Open Font License, see assets/fonts/OFL_*.txt).
  fonts:
    - family: SpaceGrotesk
      fonts:
        - asset: assets/fonts/SpaceGrotesk_500Medium.ttf
          weight: 500
        - asset: assets/fonts/SpaceGrotesk_600SemiBold.ttf
          weight: 600
        - asset: assets/fonts/SpaceGrotesk_700Bold.ttf
          weight: 700
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter_400Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter_500Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter_600SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter_700Bold.ttf
          weight: 700
    - family: PlexMono
      fonts:
        - asset: assets/fonts/IBMPlexMono_400Regular.ttf
          weight: 400
        - asset: assets/fonts/IBMPlexMono_500Medium.ttf
          weight: 500
